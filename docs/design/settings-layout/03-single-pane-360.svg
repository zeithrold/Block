    <text class="small" x="40" y="492">关闭对话框会继续编辑，不会放弃更改。</text>
  </g>
  <text class="caption" x="24" y="2506">从分类首页保存后到达这里；返回仍去分类首页。</text>
  <text class="caption" x="412" y="2506">错误解除不等于保存；可返回后选择离开。</text>
  <text class="caption" x="800" y="2506">保存成功才回 Home；失败则保留草稿并定位问题。</text>

  <text class="label" x="24" y="2566">10 · 普通保存成功 / 留在设置</text>
  <text class="label" x="412" y="2566">11 · English / 分类名称检查</text>
