<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="3360" viewBox="0 0 1184 3360" role="img" aria-labelledby="title desc">
  <title id="title">Block: 360 by 720 single-pane Settings storyboard</title>
  <desc id="desc">Twelve static, numbered design frames. Read left to right, then down. The sequence covers categories, shared drafts, scrolling, cross-category validation, correction and leaving. The final two frames inspect English content. All windows are 360 by 720 logical pixels. Example values are illustrative. The exit and saved states are alternative outcomes, not results of executed software.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #171717 }
    .heading { font-size: 18px; font-weight: 600 }
    .label { font-weight: 600 }
    .small { font-size: 12px; fill: #737373 }
    .muted { fill: #737373 }
    .caption { font-size: 12px; fill: #525252 }
    .board { font-size: 24px; font-weight: 600 }
    .line { fill: none; stroke: #e5e5e5 }
    .field { fill: #fff; stroke: #d4d4d4 }
    .icon { fill: none; stroke: #737373; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
    .primary { fill: #fff; font-weight: 600 }
    .error { fill: #b42318 }
    .error-small { font-size: 12px; fill: #b42318 }
  </style>
  <defs>
    <g id="back"><path class="icon" d="M19 12 H5 M12 5 l-7 7 7 7"/></g>
    <g id="next"><path class="icon" d="m9 5 7 7-7 7"/></g>
    <g id="down"><path class="icon" d="m6 9 6 6 6-6"/></g>
    <g id="frame">
      <rect width="360" height="720" rx="12" fill="#fff" stroke="#dedede"/>
      <path class="line" d="M0 56 H360 M0 632 H360"/>
