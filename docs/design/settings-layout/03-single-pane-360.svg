    <rect class="field" x="24" y="576" width="120" height="32" rx="10"/>
    <text x="84" y="597" text-anchor="middle">测试连接</text>
    <use href="#dirty-footer"/>
  </g>
  <text class="caption" x="24" y="1686">内存、Java 与路径纵向排列，不缩小正文。</text>
  <text class="caption" x="412" y="1686">固定导航和保存区；只有正文滚动。</text>
  <text class="caption" x="800" y="1686">返回分类首页，点击保存全部更改。</text>

  <text class="label" x="24" y="1746">07 · 保存失败 / 定位代理地址</text>
  <text class="label" x="412" y="1746">08 · 修正输入 / 尚未保存</text>
  <text class="label" x="800" y="1746">09 · 有草稿时离开设置</text>
