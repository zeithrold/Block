    <text class="muted" x="24" y="92">让 Block 更符合你的习惯。</text>
    <text class="label" x="24" y="140">语言</text>
    <rect class="field" x="24" y="154" width="312" height="32" rx="10"/>
    <text x="36" y="175">简体中文</text><use href="#down" x="304" y="158"/>
    <text class="label" x="24" y="232">外观</text>
    <rect class="field" x="24" y="246" width="312" height="32" rx="10"/>
    <text x="36" y="267">浅色</text><use href="#down" x="304" y="250"/>
    <text class="label" x="24" y="328">减少动画</text>
    <rect x="296" y="310" width="40" height="24" rx="12" fill="#171717"/>
    <circle cx="324" cy="322" r="9" fill="#fff"/>
    <text class="small" x="24" y="360">始终遵循系统的减少动态效果设置。</text>
    <path class="line" d="M24 400 H336"/>
    <text class="small" x="24" y="430">语言、外观和动画会即时预览。</text>
    <text class="small" x="24" y="450">保存以保留；放弃更改会恢复已保存的偏好。</text>
    <rect class="field" x="24" y="510" width="168" height="32" rx="10"/>
    <text x="108" y="531" text-anchor="middle">恢复本分类默认值</text>
    <use href="#dirty-footer"/>
  </g>
  <g transform="translate(800 120)">
    <use href="#frame"/><use href="#index-content"/>
    <rect x="240" y="120" width="58" height="24" rx="6" fill="#f2f2f2"/>
    <text class="small" x="269" y="136" text-anchor="middle">已修改</text>
    <rect x="20" y="112" width="320" height="64" rx="10" fill="none" stroke="#737373" stroke-width="2"/>
    <use href="#dirty-footer"/>
  </g>
  <text class="caption" x="24" y="866">进入分类，不改变窗口尺寸。</text>
  <text class="caption" x="412" y="866">开启减少动画；返回不等于取消。</text>
  <text class="caption" x="800" y="866">恢复常规行焦点；再选择游戏默认设置。</text>

  <text class="label" x="24" y="926">04 · 游戏默认 / 表单顶部</text>
  <text class="label" x="412" y="926">05 · 同一表单 / 向下滚动</text>
  <text class="label" x="800" y="926">06 · 下载草稿 / 返回后统一保存</text>
  <g transform="translate(24 940)">
    <use href="#frame"/><use href="#game-top"/><use href="#dirty-footer"/>
  </g>
  <g transform="translate(412 940)">
    <use href="#frame"/><text class="heading" x="56" y="35">游戏默认设置</text>
    <text class="label" x="24" y="92">游戏窗口</text>
    <text x="24" y="124">宽度（px）</text>
    <rect class="field" x="24" y="138" width="312" height="32" rx="10"/>
