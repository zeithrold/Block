      <path class="icon" d="m326 23 10 10 m0-10-10 10"/>
    </g>
    <g id="dirty-footer">
      <text class="small" x="24" y="653">有未保存的更改 · 返回分类不会丢失</text>
      <rect x="24" y="668" width="312" height="32" rx="10" fill="#171717"/>
      <text class="primary" x="180" y="689" text-anchor="middle">保存全部更改</text>
    </g>
    <g id="clean-footer">
      <text class="small" x="24" y="653">所有更改已保存</text>
      <rect x="24" y="668" width="312" height="32" rx="10" fill="#f2f2f2"/>
      <text class="muted" x="180" y="689" text-anchor="middle">保存全部更改</text>
    </g>
    <g id="index-content">
      <text class="heading" x="56" y="35">设置</text>
      <text class="muted" x="24" y="92">选择要调整的内容</text>
      <text class="label" x="24" y="138">常规</text>
      <text class="small" x="24" y="162">语言、外观与动画</text>
      <use href="#next" x="312" y="130"/>
      <path class="line" d="M24 188 H336"/>
      <text class="label" x="24" y="222">游戏默认设置</text>
      <text class="small" x="24" y="246">内存、Java 与游戏窗口</text>
      <use href="#next" x="312" y="214"/>
      <path class="line" d="M24 272 H336"/>
      <text class="label" x="24" y="306">配置模式</text>
      <text class="small" x="24" y="330">实例与配置如何配合</text>
      <use href="#next" x="312" y="298"/>
      <path class="line" d="M24 356 H336"/>
      <text class="label" x="24" y="390">下载与网络</text>
      <text class="small" x="24" y="414">下载限制、重试与代理</text>
      <use href="#next" x="312" y="382"/>
      <path class="line" d="M24 440 H336"/>
      <text class="label" x="24" y="474">存储</text>
      <text class="small" x="24" y="498">查看数据与游戏位置</text>
      <use href="#next" x="312" y="466"/>
    </g>
    <g id="game-top">
      <text class="heading" x="56" y="35">游戏默认设置</text>
      <text class="small" x="24" y="92">用于默认启动偏好；独立配置可另行调整。</text>
      <text class="label" x="24" y="136">内存</text>
      <text x="24" y="168">最大内存（MiB）</text>
      <rect class="field" x="24" y="182" width="312" height="32" rx="10"/>
      <text x="36" y="203">4096</text>
      <text class="small" x="24" y="236">为游戏分配的最大内存。</text>
      <text class="label" x="24" y="284">Java</text>
      <text x="24" y="316">Java 来源</text>
      <rect class="field" x="24" y="330" width="312" height="32" rx="10"/>
      <text x="36" y="351">自定义 Java</text><use href="#down" x="304" y="334"/>
      <text x="24" y="394">Java 路径</text>
      <rect class="field" x="24" y="408" width="312" height="32" rx="10"/>
      <text x="36" y="429">/opt/jdk-21/bin/java</text>
      <text class="small" x="24" y="462">填写 Java 可执行文件的位置。</text>
      <text class="label" x="24" y="510">游戏窗口</text>
      <text x="24" y="542">窗口尺寸</text>
      <rect class="field" x="24" y="556" width="312" height="32" rx="10"/>
      <text x="36" y="577">自定义</text><use href="#down" x="304" y="560"/>
      <rect x="352" y="80" width="3" height="230" rx="1.5" fill="#d4d4d4"/>
    </g>
    <g id="proxy-fields">
      <text class="label" x="24" y="238">连接</text>
      <text x="24" y="270">代理</text>
      <rect class="field" x="24" y="284" width="312" height="32" rx="10"/>
      <text x="36" y="305">手动代理</text><use href="#down" x="304" y="288"/>
      <text x="24" y="350">代理地址</text>
      <text class="small" x="24" y="442">支持 HTTP、HTTPS 与 SOCKS5 URL。</text>
      <text class="small" x="24" y="462">不支持凭据。测试连接不会保存设置。</text>
      <rect class="field" x="24" y="486" width="120" height="32" rx="10"/>
      <text x="84" y="507" text-anchor="middle">测试连接</text>
      <rect x="352" y="286" width="3" height="260" rx="1.5" fill="#d4d4d4"/>
    </g>
  </defs>
  <rect width="1184" height="3360" fill="#f5f5f5"/>
  <text class="board" x="24" y="38">Block · 单面板设置 · 360 × 720</text>
  <text class="caption" x="24" y="64">静态流程研究；窗口与 Home 同尺寸。数字是图板顺序，不是产品中的步骤。数值与路径为示例。</text>

  <text class="label" x="24" y="106">01 · 分类首页 / 无修改</text>
  <text class="label" x="412" y="106">02 · 修改常规 / 即时预览</text>
  <text class="label" x="800" y="106">03 · 返回分类 / 草稿仍在</text>
  <g transform="translate(24 120)">
    <use href="#frame"/><use href="#index-content"/>
    <text class="small" x="24" y="653">没有未保存的更改</text>
    <rect x="24" y="668" width="312" height="32" rx="10" fill="#f2f2f2"/>
    <text class="muted" x="180" y="689" text-anchor="middle">保存全部更改</text>
  </g>
  <g transform="translate(412 120)">
