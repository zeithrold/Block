    <g id="index-content" transform="translate(30 0)">
      <text class="title" x="0" y="103">设置</text>
      <text class="description" x="0" y="130">选择要更改的设置分类。</text>
      <rect class="field" x="0" y="160" width="560" height="370" rx="10"/>
      <text class="label" x="18" y="190">常规</text><text class="hint" x="18" y="211">语言 · 外观 · 减少动画</text><path class="icon" d="M530 187 l6 6 -6 6"/>
      <path class="separator" d="M0 234 H560"/>
      <text class="label" x="18" y="264">游戏默认设置</text><text class="hint" x="18" y="285">新游戏的内存 · Java · 窗口</text><path class="icon" d="M530 261 l6 6 -6 6"/>
      <path class="separator" d="M0 308 H560"/>
      <text class="label" x="18" y="338">配置模式</text><text class="hint" x="18" y="359">实例与配置的组织方式</text><path class="icon" d="M530 335 l6 6 -6 6"/>
      <path class="separator" d="M0 382 H560"/>
      <text class="label" x="18" y="412">下载与网络</text><text class="hint" x="18" y="433">下载限制 · 代理 · 连接测试</text><path class="icon" d="M530 409 l6 6 -6 6"/>
      <path class="separator" d="M0 456 H560"/>
      <text class="label" x="18" y="486">存储</text><text class="hint" x="18" y="507">自动管理的游戏和缓存位置</text><path class="icon" d="M530 483 l6 6 -6 6"/>
    </g>
    <g id="general">
      <text class="title" x="0" y="103">常规</text>
      <text class="description" x="0" y="130">让 Block 更符合你的习惯。</text>
      <text class="label" x="0" y="169">语言</text>
      <rect class="field" x="0" y="180" width="560" height="36" rx="8"/>
      <text x="14" y="203">简体中文</text><path class="icon" d="M528 195 l6 6 6 -6"/>
      <text class="hint" x="0" y="240">立即生效。保存更改会保留此语言；取消会恢复已保存的语言。</text>
      <text class="label" x="0" y="285">外观</text>
      <rect class="field" x="0" y="296" width="560" height="36" rx="8"/>
      <text x="14" y="319">浅色</text><path class="icon" d="M528 311 l6 6 6 -6"/>
      <text class="label" x="0" y="382">减少动画</text>
      <rect x="518" y="364" width="42" height="24" rx="12" fill="#d4d4d4"/><circle cx="530" cy="376" r="9" fill="#fff"/>
      <text class="hint" x="0" y="410">在整个 Block 中使用更简单的过渡动画。</text>
      <text class="hint" x="0" y="429">始终遵循系统的减少动态效果设置。</text>
      <rect class="subtle" x="0" y="470" width="560" height="70" rx="10"/>
      <text class="hint" x="14" y="497">外观和语言会立即预览。保存更改会保留这些选择；</text>
      <text class="hint" x="14" y="517">取消会恢复已保存的选择。</text>
    </g>
    <g id="profile">
      <text class="title" x="0" y="103">配置模式</text>
      <text class="description" x="0" y="130">选择实例与配置如何协同工作。</text>
      <rect x="0" y="158" width="560" height="96" rx="10" fill="#fff" stroke="#a3a3a3" stroke-width="2"/>
      <text class="label" x="16" y="186">内置配置</text>
      <rect class="subtle" x="496" y="167" width="48" height="24" rx="7"/><text class="small" x="508" y="184">当前</text>
      <text class="hint" x="16" y="215">推荐新手使用。一个实例有一个配置及其独立的启动偏好。</text>
      <rect class="field" x="0" y="267" width="560" height="96" rx="10"/>
      <text class="label" x="16" y="295">分离配置</text>
      <text class="hint" x="16" y="324">在多个配置间复用同一个实例，各自拥有独立的账户、内存和 JVM 参数。</text>
      <text class="hint" x="0" y="398">你可以切换到分离配置一次。现有的实例、配置和文件保持不变。</text>
      <text class="hint" x="0" y="418">此操作无法撤销。</text>
      <rect class="field" x="0" y="445" width="200" height="36" rx="8"/>
      <text class="button-label" x="15" y="468">切换到分离配置…</text>
      <text class="hint" x="0" y="519">模式更改会立即生效。</text>
      <text class="hint" x="0" y="541">下方保存和取消仅针对偏好草稿，不会撤销模式转换。</text>
    </g>
    <g id="storage">
      <text class="title" x="0" y="103">存储</text>
      <text class="description" x="0" y="130">Block 会自动选择游戏和下载的存放位置。</text>
      <text class="hint" x="0" y="174">便携版将游戏保存在应用旁边；安装版使用全局应用数据文件夹。</text>
      <text class="hint" x="0" y="194">这些位置由 Block 自动选择，无法在此更改。</text>
      <text class="label" x="0" y="240">游戏存储</text>
      <rect class="subtle" x="0" y="252" width="560" height="54" rx="8"/>
      <text x="14" y="285">/home/player/.local/share/block/games</text>
      <text class="label" x="0" y="347">下载缓存</text>
      <rect class="subtle" x="0" y="359" width="560" height="54" rx="8"/>
      <text x="14" y="392">/home/player/.cache/block/downloads</text>
      <text class="hint" x="0" y="461">存储位置由 Block 自动管理。</text>
    </g>
    <g id="storage-en">
      <text class="title" x="0" y="103">Storage</text>
      <text class="description" x="0" y="130">Block chooses where games and downloads live automatically.</text>
      <text class="hint" x="0" y="174">Portable builds keep games beside the app; installed builds use the global</text>
      <text class="hint" x="0" y="194">app-data folder. These locations are chosen automatically and cannot be changed here.</text>
      <text class="label" x="0" y="240">Game storage</text>
      <rect class="subtle" x="0" y="252" width="560" height="76" rx="8"/>
      <text x="14" y="280">/home/player/.local/share/block/very-long-library-name/</text>
      <text x="14" y="301">minecraft-installations-and-profiles</text>
      <text class="label" x="0" y="369">Download cache</text>
      <rect class="subtle" x="0" y="381" width="560" height="54" rx="8"/>
      <text x="14" y="414">/home/player/.cache/block/downloads</text>
      <text class="hint" x="0" y="483">Locations are managed automatically.</text>
    </g>
  </defs>
  <rect width="1580" height="4910" fill="#f5f5f5"/>
  <text class="board-title" x="32" y="42">01 / Settings: navigation and context</text>
  <text class="board-note" x="32" y="70">Design examples, not screenshots. Left A: 620 × 720; right B: 864 × 720 with a 208-wide navigator. Dimensions are hypotheses.</text>
  <text class="board-note" x="32" y="92">Values, paths and copy added for the comparison are illustrative. The same 560-wide reading column is used in both details.</text>

  <text class="panel-label" x="32" y="132">A · Category index / back returns here</text><text class="panel-label" x="684" y="132">B · Categories remain visible</text>
