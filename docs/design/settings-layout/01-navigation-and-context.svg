<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="4910" viewBox="0 0 1580 4910" role="img" aria-labelledby="title desc">
  <title id="title">Settings comparison: navigation, General, Profile mode and Storage</title>
  <desc id="desc">Paired design examples. Left is a single-content category index and drill-in page; right is compact persistent category navigation and a bounded content column. Both use the same settings and draft semantics. Values and paths are examples, not observations.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0a0a0a; font-size: 14px }
