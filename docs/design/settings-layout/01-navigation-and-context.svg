    .description { font-size: 14px; fill: #737373 }
    .label { font-size: 14px; font-weight: 600 }
    .hint { font-size: 12px; fill: #737373 }
    .small { font-size: 12px }
    .nav { font-size: 14px; fill: #525252 }
    .nav-active { font-size: 14px; font-weight: 600 }
    .button-label { font-size: 13px; font-weight: 600 }
    .button-primary { fill: #fafafa; font-size: 13px; font-weight: 600 }
    .surface { fill: #fff; stroke: #e5e5e5 }
    .field { fill: #fff; stroke: #d4d4d4 }
    .subtle { fill: #f5f5f5 }
    .primary { fill: #171717 }
    .separator { stroke: #e5e5e5 }
    .icon { fill: none; stroke: #737373; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
  </style>
