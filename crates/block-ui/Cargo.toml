[package]
name = "block-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui_platform.workspace = true
block-drop.workspace = true
raw-window-handle.workspace = true
async-channel.workspace = true
anyhow.workspace = true
block-auth.workspace = true
unicode-segmentation.workspace = true
tempfile.workspace = true
block-launcher.workspace = true
directories.workspace = true
minecraft-manifest.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
semver = "1"
gpui-component = "=0.8.0"
gpui-kit-assets = "=0.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { version = "=0.8.0", features = ["test-support"] }
gpui-base = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_text = { package = "gpui-pre-apple", version = "=0.3.9" }
