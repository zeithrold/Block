[package]
name = "block-drop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit/Foundation objects are reached through objc2 so the crate can own a
# real `NSView` dragging destination without adding an Objective-C toolchain.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDragging",
    "NSPasteboard",
    "NSResponder",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The X11 stack is already in the workspace through GPUI; this crate only adds
# the safe XCB bindings it directly uses for XDND.
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }

# The safety-critical Win32/OLE code lives here, so this crate restates the
# workspace lint set with `unsafe_code` allowed instead of inheriting it.
[lints.rust]
unfulfilled_lint_expectations = "allow"
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
