<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block · ActionListCard 原型</title>
<style>
  :root {color-scheme:light dark; font:14px/1.5 system-ui,sans-serif;
    --bg:light-dark(#fff,#191919); --ink:light-dark(#171717,#fafafa);
    --line:light-dark(#dedede,#414141); --muted:light-dark(#606060,#bababa);
    --hover:light-dark(#f4f4f4,#292929)}
  * {box-sizing:border-box}
  body {margin:0; min-height:100svh; display:grid; place-content:center; padding:12px;
    background:light-dark(#f1f1f1,#101010); color:var(--ink)}
  .window {width:min(360px,calc(100vw - 24px)); min-height:min(720px,90svh);
    background:var(--bg); border:1px solid var(--line); display:flex; flex-direction:column}
  header {height:56px; border-bottom:1px solid var(--line); padding:0 16px;
    display:flex; align-items:center; justify-content:space-between}
  header small, p, output, .end {color:var(--muted)}
  main {padding:16px}
  h1 {font-size:20px; line-height:1.4; margin:0 0 8px}
  p, .desc, output {font-size:12px; line-height:1.625}
  p {margin:0 0 20px}
  .card {border:1px solid var(--line); border-radius:14px; overflow:hidden}
  button {cursor:pointer; color:inherit; font:inherit; background:none}
  .row {display:grid; grid-template-columns:18px 1fr 16px; gap:10px; text-align:start;
    width:100%; padding:13px; border:0; align-items:start}
  .row + .row {border-top:1px solid var(--line)}
  .row:hover,.row:focus-visible {background:var(--hover)}
  .row:focus-visible {outline:2px solid currentColor; outline-offset:-3px}
  svg {width:18px; height:18px; margin-top:1.5px; fill:none; stroke:currentColor;
    stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round}
  .end {width:16px; height:16px; align-self:center; margin:0}
  strong {font-weight:600}
  .desc {display:block; color:var(--muted); margin-top:3px}
  output {display:block; margin:12px 0}
  footer {margin-top:auto; border-top:1px solid var(--line); padding:12px 16px}
  label {cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px}
  .window:has(#icons:not(:checked)) .lead {display:none}
  .window:has(#icons:not(:checked)) .row {grid-template-columns:1fr 16px}
</style>
<div class="window">
  <header><span>账户</span><small>Block · 交互原型</small></header>
  <main>
    <h1>在浏览器中完成 Microsoft 登录</h1>
    <p>Block 正在等待登录结果。在浏览器中完成登录后，Block 会自动验证账户，无需额外操作。</p>
    <div class="card">
      <button class="row" type="button" data-feedback="原型演示：此操作会在外部浏览器中重新打开登录页。">
        <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M3 9h18M6 6.5h.1m2.5 0h.1"/></svg>
        <span><strong>重新打开登录页</strong><span class="desc">如果 Microsoft 登录页没有自动打开，或已被关闭，点这里再次打开。</span></span>
        <svg class="end" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-10 10M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>
      </button>
      <button class="row" type="button" data-feedback="原型演示：此操作会进入 Block 的设备代码登录页。">
        <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 11h2m3 0h3m-5 7.5h2"/></svg>
        <span><strong>改用设备代码</strong><span class="desc">换用手机或另一台电脑，输入代码登录。</span></span>
        <svg class="end" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
    <output aria-live="polite"></output>
  </main>
  <footer><label><input type="checkbox" id="icons" checked>显示左侧图标（取消可对照原版）</label></footer>
</div>
<script>
  for (const row of document.querySelectorAll('.row')) {
    row.onclick = () => { document.querySelector('output').textContent = row.dataset.feedback; };
  }
</script>
</html>
