[workspace]
members = ["crates/block-app", "crates/block-ui", "crates/minecraft-manifest", "crates/block-download", "crates/block-launcher", "crates/block-cli", "crates/block-auth", "crates/block-drop"]
default-members = ["crates/block-app"]
resolver = "3"


[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"

[workspace.dependencies]
block-auth = { path = "crates/block-auth" }
unicode-segmentation = "1"
block-ui = { path = "crates/block-ui" }
block-drop = { path = "crates/block-drop" }
raw-window-handle = "0.6"
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-base = "=0.8.0"
anyhow = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"
sha1 = "0.10"
tempfile = "3"
block-download = { path = "crates/block-download" }
block-launcher = { path = "crates/block-launcher" }
minecraft-manifest = { path = "crates/minecraft-manifest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "process", "sync", "time", "signal", "net"] }
interprocess = { version = "2.4.6", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
fs2 = "0.4"
regex = "1"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
md-5 = "0.10"
zip = { version = "5", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
directories = "6"
winresource = { version = "0.1.34", default-features = false }

[workspace.lints.rust]
unfulfilled_lint_expectations = "allow"
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

# Pilot release packages: drop symbols and use one LTO unit so the distributed
# binary stays small. `panic = "abort"` and `opt-level = "s"` are deliberately
# not set: crash reporting and animation quality outrank the extra bytes.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
