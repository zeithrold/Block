name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}

# A newer push supersedes an in-flight check matrix for the same ref.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        # Linux ARM64 uses GitHub's arm64 hosted runner, free for public repositories.
        include:
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: windows-2022
            platform: windows-amd64
          - os: windows-11-arm
            platform: windows-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
    env:
      # sccache keeps compiler output in this repository's GitHub Actions cache.
      # The namespace names the compile host, not just the target: the same OS
      # and architecture run under different library baselines (Ubuntu 22.04
      # glibc 2.35 versus 24.04 glibc 2.39, see docs/linux-glibc-baseline.md),
      # and a cache built against one baseline must never satisfy the other.
      # Changing the namespace abandons the old entries.
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: ${{ matrix.platform }}-${{ matrix.os }}
      # Pull requests reuse entries published by trusted pushes but never
      # publish entries of their own.
      SCCACHE_GHA_RW_MODE: "${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Verify the sccache backend
        shell: bash
        run: |
          sccache --start-server
          sccache --show-stats
      - name: Verify runner and Rust host architecture
        run: python scripts/verify-platform.py --platform ${{ matrix.platform }} --verify-host-only
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libasound2-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Verify core, desktop, framework interactions, and session supervision
        id: verify
        run: python scripts/verify-platform.py --platform ${{ matrix.platform }}
      - name: Report sccache statistics
        if: always()
        continue-on-error: true
        shell: bash
        run: sccache --show-stats
      - name: Upload the native launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.platform }}
          path: ${{ steps.verify.outputs.executable }}
          if-no-files-found: error
