name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight check matrix for the same ref.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        # Linux ARM64 uses GitHub's arm64 hosted runner, free for public repositories.
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2022
            platform: windows-amd64
          - os: windows-11-arm
            platform: windows-arm64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify runner and Rust host architecture
        run: python scripts/verify-platform.py --platform ${{ matrix.platform }} --verify-host-only
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libasound2-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Verify core, desktop, framework interactions, and session supervision
        id: verify
        run: python scripts/verify-platform.py --platform ${{ matrix.platform }}
      - name: Upload the native launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.platform }}
          path: ${{ steps.verify.outputs.executable }}
          if-no-files-found: error
