name: Windows ARM64 checks

# GitHub-hosted Windows ARM64 runners are still a preview offering, so this job is
# manual instead of being part of the required push matrix. The launcher must
# build and run natively on Windows ARM64 (decision 22); game launch there is a
# recorded best-effort outcome, not a CI requirement.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native / windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify runner and Rust host architecture
        run: python scripts/verify-platform.py --platform windows-arm64 --verify-host-only
      - name: Verify core, desktop, framework interactions, and session supervision
        run: python scripts/verify-platform.py --platform windows-arm64
      - name: Upload the native ARM64 launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-windows-arm64
          path: target/debug/block.exe
          if-no-files-found: error
